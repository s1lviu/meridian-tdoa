#cloud-config
# Ubuntu 24.04 on a server you administer. This file does not provision a cloud instance.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ca-certificates
  - curl
  - python3
runcmd:
  - [systemctl, enable, --now, docker]
  - [usermod, -aG, docker, ubuntu]
  - [mkdir, -p, /opt/meridian]
  - [chown, ubuntu:ubuntu, /opt/meridian]
