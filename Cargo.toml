[package]
name = "meridian-tdoa"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "meridian-tdoa"
path = "src/main.rs"

[[bin]]
name = "meridian-node"
path = "src/bin/meridian-node.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
futures-core = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "limit", "trace"] }
geographiclib-rs = "0.2.7"
libm = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "blocking", "json"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
